name: CI

# What this can and cannot prove, stated up front because the difference matters.
#
# The published repository exports `src`, not `tests` — development material stays
# local by the owner's publication policy. So on the public repo this workflow does
# NOT run the unit suite; the `tests` step below is conditional and skips when the
# directory is absent, so the same file keeps working unchanged if that policy ever
# changes.
#
# What remains is not a consolation prize: it is the half a source-tree test run
# cannot reach. Wheels that build, install clean on an OS and Python the author
# does not use, and console scripts that still work afterwards. A module missing
# from the wheel, an archetype template not packaged as data, an entry-point typo
# — every one of those is invisible to `pytest` in the repo and fatal to a user
# running `uv tool install`.
#
# v0.22 adds `scripts/reference-bundle.sh`, and it is the answer to a fair
# criticism: without unit tests, an outside reader could check that the tool
# INSTALLS but not that its contract HOLDS. The smoke test proves the commands
# run. The reference bundle proves the gates can still say no.
#
# It builds a bundle from `scripts/reference-corpus/`, drives it to
# `release_check.ok == true` through the installed wheel, then breaks it in
# twenty-five places the contract names and requires each one to go red WITH ITS OWN ERROR
# CODE — never merely a nonzero exit, because `release_check` composes a dozen
# gates into one boolean and redness proves nothing about any single one. Each
# break also asserts it edited something first, so a mutation that silently
# matched nothing cannot pass as evidence. It finishes by re-checking the
# unbroken bundle, because twenty-five reds only mean something if green is still
# reachable.
#
# That is a black-box trust-boundary suite an external reader can run, and it
# ships in the public export.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-smoke:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          # The post-job cache step errors outright when nothing was downloaded
          # ("Cache path ... does not exist on disk"), which turned three green
          # jobs red. This CI is small; the cache is not worth a failure mode.
          enable-cache: false

      - name: Build and install all three packages from wheels
        shell: bash
        run: |
          set -euo pipefail
          # --clear because setup-uv's python-version input ALREADY created a
          # .venv here and exported VIRTUAL_ENV; without it uv aborts with
          # "A virtual environment already exists at: .venv". Recreating it
          # explicitly keeps this step deterministic rather than depending on
          # whatever the action happened to provision.
          uv venv --clear --python ${{ matrix.python }} .venv
          # Non-editable by default (editable needs -e), so this installs the BUILT
          # artifact rather than the source tree: a file the packaging config
          # forgets fails here instead of surprising whoever runs `uv tool install`.
          uv pip install --python .venv ./core ./adapters/mcp ./adapters/normalize

      - name: End-to-end smoke test against the installed commands
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then export PATH="$PWD/.venv/Scripts:$PATH"
          else export PATH="$PWD/.venv/bin:$PATH"; fi
          okfy --help > /dev/null
          ./scripts/smoke.sh

      - name: Reference bundle — the contract holds, and the gates still say no
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then export PATH="$PWD/.venv/Scripts:$PATH"
          else export PATH="$PWD/.venv/bin:$PATH"; fi
          # Its own workdir under the runner temp: the script refuses to build
          # into an existing bundle path, and a bundle records its corpus path,
          # so it must not be built inside the checkout.
          ./scripts/reference-bundle.sh "${RUNNER_TEMP:-/tmp}/okfy-reference"

      - name: Unit suites (skipped when tests are not part of this export)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d core/tests ]; then
            echo "core/tests absent — this export ships src only; skipping."
            exit 0
          fi
          (cd core && uv run --python ${{ matrix.python }} pytest -q)
          if [ -d adapters/mcp/tests ]; then
            (cd adapters/mcp && uv run --python ${{ matrix.python }} pytest -q)
          fi
          if [ -d adapters/normalize/tests ]; then
            (cd adapters/normalize && uv run --python ${{ matrix.python }} pytest -q)
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: false
      # Two traps here, both hit while writing this file.
      # 1. Per package, from INSIDE it: the ruff configuration lives in each
      #    pyproject.toml, so `ruff check core adapters/mcp` from the repo root
      #    ignores both and reports 158 phantom errors.
      # 2. `uv run ruff`, never `uvx ruff`: uvx fetches the latest release
      #    (0.16.1 today) while the project pins one (0.15.20), and the newer
      #    rule set reported 77 errors on a tree that is clean under the pin.
      #    CI that lints with a different tool than the author is CI that fails
      #    for reasons the author cannot reproduce.
      - shell: bash
        run: |
          set -euo pipefail
          (cd core && uv run ruff check .)
          (cd adapters/mcp && uv run ruff check .)
          (cd adapters/normalize && uv run ruff check .)

  lockfile:
    name: uv lock --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: false
      # `uv run` silently updates a stale lockfile, so a green local test run hides
      # the divergence — exactly how adapters/mcp/uv.lock sat at 0.11.1 while both
      # pyprojects declared 0.12.0. This is the step that makes it visible.
      #
      # Each lockfile used to be guarded by `if [ -f ... ]; then check; fi`,
      # which made DELETING a lockfile a silent pass instead of a failure —
      # the three lockfiles below are declared, not optional, so their
      # absence is itself a fault, checked before any `uv lock --check` runs.
      - shell: bash
        run: |
          set -euo pipefail
          for lock in adapters/mcp/uv.lock core/uv.lock adapters/normalize/uv.lock; do
            if [ ! -f "$lock" ]; then
              echo "missing declared lockfile: $lock" >&2
              exit 1
            fi
          done
          (cd adapters/mcp && uv lock --check)
          (cd core && uv lock --check)
          (cd adapters/normalize && uv lock --check)

  versions-agree:
    name: version strings agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No uv here on purpose: this job only reads files with the runner's own
      # python3, and installing a toolchain it does not use was what made its
      # post-job cache step fail.
      # Seven places declare the version and they have drifted before. A
      # mismatch is cheap to detect and confusing to debug from the outside.
      # normalize was published by publish.sh from the day it existed and
      # checked by none of these four jobs, so it could ship a version nothing
      # else agreed with and nothing would have said so.
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          def grab(path, pattern):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              m = re.search(pattern, text, re.M)
              assert m, f"no version found in {path}"
              return m.group(1)

          found = {
              "core/src/okfy/__init__.py":
                  grab("core/src/okfy/__init__.py", r'^__version__ = "([^"]+)"'),
              "core/pyproject.toml":
                  grab("core/pyproject.toml", r'^version = "([^"]+)"'),
              "adapters/mcp/src/okfy_mcp/__init__.py":
                  grab("adapters/mcp/src/okfy_mcp/__init__.py",
                       r'^__version__ = "([^"]+)"'),
              "adapters/mcp/pyproject.toml":
                  grab("adapters/mcp/pyproject.toml", r'^version = "([^"]+)"'),
              "adapters/normalize/src/okfy_normalize/__init__.py":
                  grab("adapters/normalize/src/okfy_normalize/__init__.py",
                       r'^__version__ = "([^"]+)"'),
              "adapters/normalize/pyproject.toml":
                  grab("adapters/normalize/pyproject.toml",
                       r'^version = "([^"]+)"'),
              "plugin/.claude-plugin/plugin.json":
                  json.loads(pathlib.Path(
                      "plugin/.claude-plugin/plugin.json").read_text())["version"],
          }
          if len(set(found.values())) != 1:
              for k, v in found.items():
                  print(f"{v:12} {k}")
              raise SystemExit("version strings disagree")
          print(f"all {len(found)} agree:", next(iter(found.values())))
          PY
