[project]
name = "okfy-normalize"
version = "0.19.0"
description = "Raw documents to normalized Markdown plus an OKFy source-map sidecar"
license = "Apache-2.0"
requires-python = ">=3.11"
# okfy only — the CONVERTERS are optional extras, never required. The whole point
# of this adapter is that OKFy never hard-depends on an OCR/ML stack.
dependencies = ["okfy"]

# NO optional-dependencies entry for docling, deliberately. Declaring the extra
# would pull docling's whole resolution (torch, opencv, ~130 packages) into this
# adapter's uv.lock — 3000 lines pinning an ML stack nothing installs — and would
# name one converter in metadata for an adapter whose entire point is that any
# converter fits. `uv pip install docling` is the install line instead.

[project.scripts]
okfy-normalize = "okfy_normalize.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15,<0.16"]

[tool.uv.sources]
okfy = { path = "../../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okfy_normalize"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
