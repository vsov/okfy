[project]
name = "okfy-mcp"
version = "0.15.0"
description = "MCP stdio adapter for OKFy knowledge bundles"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["okfy", "mcp>=1.28,<2"]

[project.scripts]
okfy-mcp = "okfy_mcp.__main__:main"

[dependency-groups]
# ruff is declared, not ambient: it was previously only ever found on the
# author's PATH, so a clean runner could not lint at all and `uvx ruff`
# would have used a different release than the one this tree is clean under.
dev = ["pytest>=8", "ruff>=0.15,<0.16"]

[tool.uv.sources]
okfy = { path = "../../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okfy_mcp"]

[tool.ruff.lint.per-file-ignores]
# Tests interleave local helper defs with imports that depend on them; matches
# the core package's convention.
"tests/*" = ["E402"]
